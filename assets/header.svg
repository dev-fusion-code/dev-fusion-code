<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian / Charcoal Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#0d0d11" />
    </linearGradient>

    <!-- Warm Amber Glow: Smooth, continuous radial falloff (no sharp edges or polygon lines) -->
    <radialGradient id="glowAmber" cx="88%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glowWarmBottom" cx="12%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Seamless Warm Top-Right Ambient Wash (fades smoothly across the entire width) -->
    <linearGradient id="warmAmbientWash" x1="100%" y1="0%" x2="40%" y2="80%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0" />
    </linearGradient>

    <!-- Warm Text Shimmer Gradient (Champagne / Warm Ivory) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Golden Amber Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Golden-Bronze Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#b45309" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#27272a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.6" />
    </linearGradient>

    <!-- Dark Dot Matrix Pattern with Warm Tint -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3f3f46" fill-opacity="0.28" />
    </pattern>
  </defs>

  <!-- Base Container Box with Rounded Corners -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="850" height="240" rx="16" fill="url(#dotPattern)" />
  <rect width="850" height="240" rx="16" fill="url(#glowAmber)" />
  <rect width="850" height="240" rx="16" fill="url(#warmAmbientWash)" />
  <rect width="850" height="240" rx="16" fill="url(#glowWarmBottom)" />
  
  <!-- Outer Card Border -->
  <rect width="848" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Top-Left Status Pill (50px Outer Margin, Balanced Internal Padding) -->
  <g transform="translate(50, 32)">
    <rect width="282" height="28" rx="14" fill="#18181b" fill-opacity="0.85" stroke="#78350f" stroke-width="1" />
    <!-- Pulsing Golden-Amber Live Dot -->
    <circle cx="22" cy="14" r="3.5" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4;3.5" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="14" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#fde68a" letter-spacing="0.5">
      B.TECH CSE · BUILDING &amp; LEARNING
    </text>
  </g>

  <!-- Top-Right Brand Pill: devfusioncode (50px Outer Margin, Balanced Internal Padding) -->
  <g transform="translate(674, 32)">
    <rect width="126" height="28" rx="14" fill="#18181b" fill-opacity="0.85" stroke="#78350f" stroke-width="1" />
    <text x="63" y="14" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#fde68a" letter-spacing="0.5">
      devfusioncode
    </text>
  </g>

  <!-- Main Content Group (50px Left Margin) -->
  <g transform="translate(50, 0)">
    <!-- Main Heading (Saketh P) with Warm Backlit Ivory Gradient -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.8">
      Saketh P
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#d4d4d8">
      Backend Engineering <tspan fill="#71717a">·</tspan> Django &amp; FastAPI <tspan fill="#71717a">·</tspan> <tspan fill="url(#accentGrad)" font-weight="600">UI/UX Enthusiast</tspan>
    </text>

    <!-- Bottom Feature Tags (Centered horizontally & vertically) -->
    <g transform="translate(0, 176)">
      <!-- Tag 1: Backend Systems -->
      <g transform="translate(0, 0)">
        <rect width="180" height="28" rx="8" fill="#18181b" fill-opacity="0.65" stroke="#3f3f46" stroke-width="1" />
        <text x="90" y="14" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#fef3c7">
          ⚡ Backend &amp; APIs
        </text>
      </g>

      <!-- Tag 2: UI/UX & Prototyping -->
      <g transform="translate(192, 0)">
        <rect width="170" height="28" rx="8" fill="#18181b" fill-opacity="0.65" stroke="#3f3f46" stroke-width="1" />
        <text x="85" y="14" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#fef3c7">
          🎨 UI/UX &amp; Prototyping
        </text>
      </g>

      <!-- Tag 3: Hardware & Networking -->
      <g transform="translate(374, 0)">
        <rect width="185" height="28" rx="8" fill="#18181b" fill-opacity="0.65" stroke="#3f3f46" stroke-width="1" />
        <text x="92.5" y="14" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#fef3c7">
          🛠️ Hardware &amp; Networking
        </text>
      </g>
    </g>
  </g>

  <!-- Stylized Warm Backlit Ambient Element (Positioned comfortably below top-right pill) -->
  <g transform="translate(745, 115)" opacity="0.65">
    <circle cx="20" cy="20" r="34" fill="none" stroke="#78350f" stroke-width="1" stroke-dasharray="3 4" opacity="0.45" />
    <circle cx="20" cy="20" r="20" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.65" />
    <circle cx="20" cy="20" r="9" fill="#f59e0b" fill-opacity="0.25" />
    <circle cx="20" cy="20" r="3.5" fill="#fbbf24" />
  </g>
</svg>
